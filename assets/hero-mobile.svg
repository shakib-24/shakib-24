<svg width="600" height="780" viewBox="0 0 600 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering console for Shakib Hasan, System Engineer, based in Tokyo, Japan, focused on AI-assisted engineering, full-stack development and automation, status online">
  <title>Shakib Hasan — Engineering Console</title>
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1119"/>
      <stop offset="100%" stop-color="#04070b"/>
    </linearGradient>
    <radialGradient id="m-vignette" cx="50%" cy="20%" r="80%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="m-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#101a24" stroke-width="1"/>
    </pattern>
    <linearGradient id="m-divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="598" height="778" rx="16" fill="url(#m-bg)" stroke="#1c2b38" stroke-width="1.5"/>
  <rect x="1" y="1" width="598" height="778" rx="16" fill="url(#m-grid)"/>
  <rect x="1" y="1" width="598" height="778" rx="16" fill="url(#m-vignette)"/>

  <g stroke="#5eead4" stroke-width="1.6" opacity="0.55" fill="none">
    <path d="M14 30 V14 H30"/>
    <path d="M570 14 H586 V30"/>
    <path d="M14 750 V766 H30"/>
    <path d="M586 750 V766 H570"/>
  </g>

  <!-- header -->
  <text x="300" y="30" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#7f8da0">SHAKIB.SYS&#160;//&#160;CONSOLE</text>
  <circle cx="270" cy="46" r="3.5" fill="#3ddc97">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="280" y="49" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="10" letter-spacing="1" fill="#7f8da0">LIVE</text>
  <line x1="0" y1="60" x2="600" y2="60" stroke="#101a24" stroke-width="1"/>

  <!-- portrait — ASCII field derived locally from assets/profile-photo.png -->
  <text x="300" y="78" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="9" letter-spacing="2" fill="#4c5b6b">VISUAL MODULE // NODE_01</text>
  <g xml:space="preserve" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="11" fill="#5c7c8a">
    <text x="180" y="92" textLength="240" lengthAdjust="spacingAndGlyphs">                                </text>
    <text x="180" y="106" textLength="240" lengthAdjust="spacingAndGlyphs">                                </text>
    <text x="180" y="120" textLength="240" lengthAdjust="spacingAndGlyphs">          :-=++=-.              </text>
    <text x="180" y="134" textLength="240" lengthAdjust="spacingAndGlyphs">        -#%%######*-            </text>
    <text x="180" y="148" textLength="240" lengthAdjust="spacingAndGlyphs">       =%*+=--:::-+%-           </text>
    <text x="180" y="162" textLength="240" lengthAdjust="spacingAndGlyphs">       =*----::-==-+-           </text>
    <text x="180" y="176" textLength="240" lengthAdjust="spacingAndGlyphs">        ==***=-+*+==-.          </text>
    <text x="180" y="190" textLength="240" lengthAdjust="spacingAndGlyphs">       :=-------:::-=:          </text>
    <text x="180" y="204" textLength="240" lengthAdjust="spacingAndGlyphs">        -=--=+====-=:           </text>
    <text x="180" y="218" textLength="240" lengthAdjust="spacingAndGlyphs">         :++==+===+-            </text>
    <text x="180" y="232" textLength="240" lengthAdjust="spacingAndGlyphs">          :+++*++*+:            </text>
    <text x="180" y="246" textLength="240" lengthAdjust="spacingAndGlyphs">           -++***+=.-+.         </text>
    <text x="180" y="260" textLength="240" lengthAdjust="spacingAndGlyphs">        .-+:-----:  +%#**+=-:.  </text>
    <text x="180" y="274" textLength="240" lengthAdjust="spacingAndGlyphs">    :=+*#%#. -==-. .####%%%%###*</text>
    <text x="180" y="288" textLength="240" lengthAdjust="spacingAndGlyphs">:=+##%%%###.:****= =%###########</text>
    <text x="180" y="302" textLength="240" lengthAdjust="spacingAndGlyphs">%%%########. :*#-  *############</text>
    <text x="180" y="316" textLength="240" lengthAdjust="spacingAndGlyphs">###########. +#*+ .#############</text>
    <text x="180" y="330" textLength="240" lengthAdjust="spacingAndGlyphs">%##########.:#**+ -###########%#</text>
    <text x="180" y="344" textLength="240" lengthAdjust="spacingAndGlyphs">%%#########.-#*++ +##########%%#</text>
    <text x="180" y="358" textLength="240" lengthAdjust="spacingAndGlyphs">%%%########:+***+.#########%%%%#</text>
    <text x="180" y="372" textLength="240" lengthAdjust="spacingAndGlyphs">%%%########-*#**+-########%%%%%%</text>
    <text x="180" y="386" textLength="240" lengthAdjust="spacingAndGlyphs">%%%%#######+****==##%####%%%%%%%</text>
  </g>
  <text x="300" y="404" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="9" letter-spacing="1" fill="#3c4956">ASCII RENDER — SOURCE: LOCAL PORTRAIT</text>

  <!-- identity -->
  <text x="300" y="446" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="28" font-weight="700" fill="#e8f1f5">SHAKIB HASAN</text>
  <text x="300" y="470" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="14" letter-spacing="3" fill="#5eead4">SYSTEM ENGINEER</text>

  <line x1="70" y1="490" x2="530" y2="490" stroke="url(#m-divider)" stroke-width="1"/>

  <g font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="15" xml:space="preserve">
    <text x="90" y="526"><tspan fill="#7f8da0">SYS.LOCATION</tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#c9d1d9">TOKYO / JAPAN</tspan></text>
    <text x="90" y="560"><tspan fill="#7f8da0">SYS.FOCUS   </tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#c9d1d9">AI-ASSISTED</tspan></text>
    <text x="90" y="594"><tspan fill="#7f8da0">SYS.MODE    </tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#c9d1d9">BUILDING</tspan></text>
    <text x="90" y="628"><tspan fill="#7f8da0">SYS.STACK   </tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#c9d1d9">FULL-STACK</tspan></text>
    <text x="90" y="662"><tspan fill="#7f8da0">SYS.STATUS  </tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#3ddc97">ONLINE</tspan></text>
  </g>
  <rect x="294" y="649" width="9" height="16" fill="#3ddc97">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="90" y="696" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="11" fill="#3c4956">35.6812&#176;N&#160;139.7671&#176;E&#160;&#160;::&#160;&#160;NODE JP-TOKYO-01</text>

  <text x="300" y="738" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="9" letter-spacing="1.5" fill="#3c4956">// END OF UPLINK</text>

  <rect x="1" y="60" width="598" height="8" fill="url(#m-scan)">
    <animate attributeName="y" values="60;730;60" dur="6.5s" repeatCount="indefinite"/>
  </rect>
</svg>

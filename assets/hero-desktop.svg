<svg width="1120" height="440" viewBox="0 0 1120 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering console for Shakib Hasan, System Engineer, based in Tokyo, Japan, focused on AI-assisted engineering, full-stack development and automation, status online">
  <title>Shakib Hasan — Engineering Console</title>
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1119"/>
      <stop offset="100%" stop-color="#04070b"/>
    </linearGradient>
    <radialGradient id="d-vignette" cx="50%" cy="38%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="d-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#101a24" stroke-width="1"/>
    </pattern>
    <linearGradient id="d-divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-vdivider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#33475a" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#33475a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <filter id="d-lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#d-lift)">
    <rect x="1" y="1" width="1118" height="438" rx="16" fill="url(#d-bg)" stroke="#1c2b38" stroke-width="1.5"/>
    <rect x="1" y="1" width="1118" height="438" rx="16" fill="url(#d-grid)"/>
    <rect x="1" y="1" width="1118" height="438" rx="16" fill="url(#d-vignette)"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#5eead4" stroke-width="1.6" opacity="0.55" fill="none">
    <path d="M14 30 V14 H30"/>
    <path d="M1090 14 H1106 V30"/>
    <path d="M14 410 V426 H30"/>
    <path d="M1106 410 V426 H1090"/>
  </g>

  <!-- header -->
  <text x="24" y="25" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="12" letter-spacing="1" fill="#7f8da0">SHAKIB.SYS&#160;//&#160;ENGINEERING CONSOLE</text>
  <circle cx="908" cy="20" r="4" fill="#3ddc97">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="918" y="24" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="11" letter-spacing="1" fill="#7f8da0">LIVE</text>
  <text x="1096" y="24" text-anchor="end" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="11" fill="#4c5b6b">BUILD 2026.09</text>
  <line x1="0" y1="40" x2="1120" y2="40" stroke="#101a24" stroke-width="1"/>

  <!-- vertical divider -->
  <line x1="390" y1="50" x2="390" y2="410" stroke="url(#d-vdivider)" stroke-width="1"/>
  <circle r="3" fill="#5eead4">
    <animateMotion path="M390,50 L390,410 L390,50 Z" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- ruler ticks -->
  <g stroke="#1c2b38" stroke-width="1">
    <line x1="1104" y1="50" x2="1112" y2="50"/>
    <line x1="1104" y1="130" x2="1112" y2="130"/>
    <line x1="1104" y1="210" x2="1112" y2="210"/>
    <line x1="1104" y1="290" x2="1112" y2="290"/>
    <line x1="1104" y1="370" x2="1112" y2="370"/>
  </g>


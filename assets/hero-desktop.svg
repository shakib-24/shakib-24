  <text x="68" y="58" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="10" letter-spacing="2" fill="#4c5b6b">VISUAL MODULE // NODE_01</text>
  <g xml:space="preserve" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="10" fill="#5c7c8a">

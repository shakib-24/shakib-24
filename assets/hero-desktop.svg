  <rect x="650" y="313" width="10" height="18" fill="#3ddc97">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="420" y="360" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="12" letter-spacing="0.5" fill="#3c4956">35.6812&#176;N&#160;139.7671&#176;E&#160;&#160;::&#160;&#160;NODE JP-TOKYO-01</text>

  <!-- load meter -->
  <g fill="#5eead4" opacity="0.85">
    <rect x="950" y="312" width="10" height="14">
      <animate attributeName="y" values="312;282;312" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="14;44;14" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="976" y="300" width="10" height="26">
      <animate attributeName="y" values="300;286;300" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="26;40;26" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="1002" y="292" width="10" height="34">
      <animate attributeName="y" values="292;300;292" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="34;26;34" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1028" y="304" width="10" height="22">
      <animate attributeName="y" values="304;284;304" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="22;42;22" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="994" y="340" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="9" letter-spacing="1" fill="#3c4956">LOAD</text>

  <!-- global scanline -->
  <rect x="1" y="50" width="1118" height="8" fill="url(#d-scan)">
    <animate attributeName="y" values="50;400;50" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <text x="200" y="403" text-anchor="middle" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="9" letter-spacing="1.5" fill="#3c4956">ASCII RENDER — SOURCE: LOCAL PORTRAIT</text>

  <!-- RIGHT: identity + system readout -->
  <text x="420" y="100" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="36" font-weight="700" fill="#e8f1f5">SHAKIB HASAN</text>
  <text x="421" y="126" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="15" letter-spacing="3" fill="#5eead4">SYSTEM ENGINEER</text>

  <line x1="420" y1="146" x2="1100" y2="146" stroke="url(#d-divider)" stroke-width="1"/>

  <g font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="17" xml:space="preserve">
    <text x="420" y="182"><tspan fill="#7f8da0">SYS.LOCATION</tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#c9d1d9">TOKYO / JAPAN</tspan></text>
    <text x="420" y="218"><tspan fill="#7f8da0">SYS.FOCUS   </tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#c9d1d9">AI-ASSISTED ENGINEERING</tspan></text>
    <text x="420" y="254"><tspan fill="#7f8da0">SYS.MODE    </tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#c9d1d9">BUILDING</tspan></text>
    <text x="420" y="290"><tspan fill="#7f8da0">SYS.STACK   </tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#c9d1d9">FULL-STACK / AUTOMATION</tspan></text>
    <text x="420" y="326"><tspan fill="#7f8da0">SYS.STATUS  </tspan><tspan fill="#3c4956"> :: </tspan><tspan fill="#3ddc97">ONLINE</tspan></text>
